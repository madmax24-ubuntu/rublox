<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; overflow: hidden; background: #ff0000; }
        canvas { background: #00ff00 !important; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "./node_modules/three/build/three.module.js"
        }
    }
    </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xff0000);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 2;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);

// Green cube
const box = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: false })
);
scene.add(box);

// White ambient light
const ambient = new THREE.AmbientLight(0xffffff, 1);
scene.add(ambient);

console.log('[Minimal] Scene created, canvas: ' + renderer.domElement.width + 'x' + renderer.domElement.height);

let frameCount = 0;
function animate() {
    requestAnimationFrame(animate);
    frameCount++;
    box.rotation.x += 0.01;
    box.rotation.y += 0.01;
    renderer.render(scene, camera);
    if (frameCount === 1) console.log('[Minimal] First render done');
    if (frameCount === 60) console.log('[Minimal] 60 frames rendered');
}
animate();
</script>
</body>
</html>
