<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#7ec8e3;overflow:hidden}</style>
</head>
<body>
<script type="module">
import * as THREE from "./node_modules/three/build/three.module.js";
import { MapGenerator } from "./world/MapGenerator.js";

window.__ready = false;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7ec8e3);

// Lights similar to game
const amb = new THREE.AmbientLight(0xffffff, 0.75);
scene.add(amb);
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(120, 300, 120);
scene.add(sun);
const sun2 = new THREE.DirectionalLight(0xffffff, 0.35);
sun2.position.set(-120, 200, -120);
scene.add(sun2);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);

// Orthographic top-down (slightly tilted for the iso-ish reference look can be toggled)
const aspect = window.innerWidth / window.innerHeight;
const D = 290; // half-extent
const cam = new THREE.OrthographicCamera(-D * aspect, D * aspect, D, -D, 1, 4000);

function setView(mode) {
    if (mode === 'iso') {
        cam.left = -D * aspect; cam.right = D * aspect; cam.top = D; cam.bottom = -D;
        cam.position.set(0, 700, 360);
    } else if (mode === 'hub') {
        const z = 55;
        cam.left = -z * aspect; cam.right = z * aspect; cam.top = z; cam.bottom = -z;
        cam.position.set(0, 120, 70);
    } else {
        cam.left = -D * aspect; cam.right = D * aspect; cam.top = D; cam.bottom = -D;
        cam.position.set(0, 1000, 0.001);
    }
    cam.lookAt(0, 0, 0);
    cam.updateProjectionMatrix();
}
window.setView = setView;
setView('top');

const map = new MapGenerator(scene);
window.__map = map;
map.startGeneration();
map.ready.then(() => {
    renderer.render(scene, cam);
    requestAnimationFrame(() => { renderer.render(scene, cam); window.__ready = true; });
});

function loop() {
    renderer.render(scene, cam);
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
