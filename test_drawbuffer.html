<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; overflow: hidden; background: #ff0000; }
        canvas { background: #00ff00; position: absolute; top: 0; left: 0; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "./node_modules/three/build/three.module.js"
        }
    }
    </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const canvas = document.createElement('canvas');
canvas.width = 1280;
canvas.height = 720;
document.body.appendChild(canvas);

const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true, alpha: false });
console.log('[Test] Canvas created, preserveDrawingBuffer=true, alpha=false');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xff0000);

const camera = new THREE.PerspectiveCamera(75, 1280/720, 0.1, 1000);
camera.position.z = 2;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, alpha: false });
renderer.setSize(1280, 720);
renderer.setPixelRatio(1);
renderer.setClearColor(0xff0000, 1);

const box = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshBasicMaterial({ color: 0x00ff00 })
);
scene.add(box);

const ambient = new THREE.AmbientLight(0xffffff, 1);
scene.add(ambient);

let frameCount = 0;
function animate() {
    requestAnimationFrame(animate);
    frameCount++;
    renderer.render(scene, camera);
    if (frameCount === 1) console.log('[Test] First render done');
    if (frameCount === 5) {
        // Try toDataURL
        try {
            const dataUrl = canvas.toDataURL('image/png');
            console.log('[Test] toDataURL length: ' + dataUrl.length);
        } catch(e) {
            console.log('[Test] toDataURL error: ' + e.message);
        }
    }
}
animate();
</script>
</body>
</html>
