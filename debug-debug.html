<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Rubo Arena - Debug Map Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: monospace; cursor: none; }
        
        #debugOverlay {
            position: fixed; top: 10px; left: 10px; z-index: 9999;
            background: rgba(0, 0, 0, 0.85); color: #0f0; padding: 12px;
            border-radius: 6px; font-size: 13px; line-height: 1.6;
            min-width: 280px; user-select: none; pointer-events: auto;
            border: 1px solid #0f04;
        }
        
        #debugOverlay h3 { margin-bottom: 8px; color: #fff; font-size: 15px; }
        #debugOverlay .row { display: flex; justify-content: space-between; gap: 12px; }
        #debugOverlay .label { color: #aaa; }
        
        #controls {
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 9999;
            background: rgba(0, 0, 0, 0.85); color: #fff; padding: 10px 20px;
            border-radius: 6px; font-size: 13px; text-align: center; user-select: none;
            border: 1px solid #ffffff44; pointer-events: auto;
        }
        
        canvas { display: block; width: 100vw; height: 100vh; cursor: none !important; }
    </style>
</head>
<body>
    <div id="debugOverlay">
        <h3>🗺️ Debug Map Viewer</h3>
        <div class="row"><span class="label">FPS:</span><span id="fpsCounter">0</span></div>
        <div class="row"><span class="label">Camera X:</span><span id="camX">0.00</span></div>
        <div class="row"><span class="label">Camera Y:</span><span id="camY">0.00</span></div>
        <div class="row"><span class="label">Camera Z:</span><span id="camZ">0.00</span></div>
        <div class="row"><span class="label">FOV:</span><span id="fovVal">60</span></div>
        <div class="row" style="margin-top:8px;"><span class="label">Objects:</span><span id="objCount">-</span></div>
    </div>

    <div id="controls">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move · 
        <kbd>Q</kbd>/<kbd>E</kbd> Up/Down · 
        <kbd>Scroll</kbd> Zoom · 
        <kbd>R</kbd> Reset View · 
        <kbd>T</kbd> Top-Down · 
        <kbd>F</kbd> FPS Toggle
    </div>

    <!-- Load game normally -->
    <script type="module" src="./main.js"></script>

    <script>
        // Debug overlay and camera controls
        const fpsEl = document.getElementById('fpsCounter');
        const camXEl = document.getElementById('camX');
        const camYEl = document.getElementById('camY');
        const camZEl = document.getElementById('camZ');
        const fovEl = document.getElementById('fovVal');
        const objCountEl = document.getElementById('objCount');

        let camera = null;
        let scene = null;
        
        // Debug counters
        let frameCount = 0;
        let frameTime = 0;
        let lastFrameTime = performance.now();
        let objCountCached = false;

        // Camera state for debug controls (using plain objects to avoid THREE dependency)
        const camState = {
            x: 100, y: 80, z: -100,
            lookAtX: 0, lookAtY: 0, lookAtZ: 0,
            fov: 60,
            isFPSMode: false
        };

        // Input state
        const keys = {};
        
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            
            if (!camera || !scene) return;
            
            switch(e.code) {
                case 'KeyR':
                    camState.x = 100; camState.y = 80; camState.z = -100;
                    break;
                case 'KeyT':
                    camState.x = 0; camState.y = 200; camState.z = 0.01;
                    camera.up.set(0, -1, 0);
                    camera.rotation.order = 'YXZ';
                    break;
                case 'KeyF':
                    if (camState.isFPSMode) {
                        camState.isFPSMode = false;
                    } else {
                        camState.isFPSMode = true;
                    }
                    break;
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // Mouse wheel for zoom
        window.addEventListener('wheel', (e) => {
            if (!camera || !scene) return;
            
            const dirX = camera.position.x - camState.lookAtX;
            const dirY = camera.position.z - camState.lookAtZ;
            const dist = Math.sqrt(dirX * dirX + dirY * dirY);
            const normX = dirX / (dist || 1);
            const normY = dirY / (dist || 1);
            
            if (camState.isFPSMode) {
                camState.x += normX * e.deltaY * 0.1;
                camState.z += normY * e.deltaY * 0.1;
            } else {
                camState.x -= normX * e.deltaY * 0.3;
                camState.z -= normY * e.deltaY * 0.3;
            }
            
            e.preventDefault();
        }, { passive: false });

        // Mouse drag to orbit camera (when not in FPS mode)
        let isDragging = false;
        let lastMouse = { x: 0, y: 0 };

        window.addEventListener('mousedown', (e) => {
            if (!camera || !scene || camState.isFPSMode) return;
            isDragging = true;
            lastMouse.x = e.clientX;
            lastMouse.y = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging || !camera || !scene || camState.isFPSMode) return;
            
            const dx = e.clientX - lastMouse.x;
            const dy = e.clientY - lastMouse.y;
            
            // Orbit around lookAt point using spherical coordinates
            const offsetX = camera.position.x - camState.lookAtX;
            const offsetZ = camera.position.z - camState.lookAtZ;
            const offsetY = camera.position.y - camState.lookAtY;
            
            const horizontalDist = Math.sqrt(offsetX * offsetX + offsetZ * offsetZ);
            let distance = Math.sqrt(horizontalDist * horizontalDist + offsetY * offsetY) || 100;
            
            let theta = Math.atan2(offsetX, offsetZ);
            let phi = Math.acos(Math.max(-1, Math.min(1, offsetY / (distance || 1))));
            
            theta -= dx * 0.01;
            phi += dy * 0.01;
            phi = Math.max(0.1, Math.min(Math.PI - 0.1, phi));
            
            distance = camera.position.y - camState.lookAtY + Math.cos(phi) * (distance || 1);
            
            camState.x = camState.lookAtX + Math.sin(theta) * Math.sin(phi) * (distance || 100);
            camState.z = camState.lookAtZ + Math.cos(theta) * Math.sin(phi) * (distance || 100);
        });

        function updateDebugOverlay() {
            if (!camera || !scene) return;

            // Update FPS counter
            frameCount++;
            frameTime += (performance.now() - lastFrameTime);
            lastFrameTime = performance.now();
            
            if (frameTime >= 1000) {
                fpsEl.textContent = Math.round(frameCount * 1000 / frameTime);
                frameCount = 0;
                frameTime = 0;
            }

            // Update camera info
            camXEl.textContent = camera.position.x.toFixed(2);
            camYEl.textContent = camera.position.y.toFixed(2);
            camZEl.textContent = camera.position.z.toFixed(2);
            fovEl.textContent = Math.round(camera.fov);

            // Update object count (cached)
            if (!objCountCached || frameCount % 60 === 0) {
                let count = 0;
                scene.traverse((child) => {
                    if (child.isMesh || child.isGroup) count++;
                });
                objCountEl.textContent = count.toLocaleString();
            }

            // Handle WASD movement
            const moveSpeed = camState.isFPSMode ? 1.5 : 3;
            
            // Calculate forward and right vectors from camera direction
            const dirX = camState.lookAtX - camera.position.x;
            const dirZ = camState.lookAtZ - camera.position.z;
            const dirY = camState.lookAtY - camera.position.y;
            const dist = Math.sqrt(dirX * dirX + dirZ * dirZ) || 1;
            
            // Forward vector (normalized, ignoring Y for horizontal movement)
            const fwdX = dirX / dist;
            const fwdZ = dirZ / dist;
            
            // Right vector (cross product of forward and up)
            const rightX = -fwdZ;
            const rightZ = fwdX;

            if (keys['KeyW']) {
                camState.x += fwdX * moveSpeed;
                camState.z += fwdZ * moveSpeed;
            }
            if (keys['KeyS']) {
                camState.x -= fwdX * moveSpeed;
                camState.z -= fwdZ * moveSpeed;
            }
            if (keys['KeyA']) {
                camState.x -= rightX * moveSpeed;
                camState.z -= rightZ * moveSpeed;
            }
            if (keys['KeyD']) {
                camState.x += rightX * moveSpeed;
                camState.z += rightZ * moveSpeed;
            }

            // Q/E for up/down movement
            if (keys['KeyQ']) {
                camState.y -= moveSpeed;
            }
            if (keys['KeyE']) {
                camState.y += moveSpeed;
            }

            // Update camera position and lookAt
            camera.position.set(camState.x, camState.y, camState.z);
            
            const targetLookX = camState.isFPSMode ? 
                camState.lookAtX + fwdX * 10 : camState.lookAtX;
            const targetLookZ = camState.isFPSMode ? 
                camState.lookAtZ + fwdZ * 10 : camState.lookAtZ;
            
            camera.lookAt(targetLookX, camState.lookAtY, targetLookZ);

            requestAnimationFrame(updateDebugOverlay);
        }

        // Wait for game to initialize then take control
        function waitForGame() {
            if (typeof window.game !== 'undefined' && window.game.camera) {
                camera = window.game.camera;
                scene = window.game.scene;
                
                console.log('🎮 Debug Map Viewer activated!');

                // Override game's camera sync to not interfere with debug controls
                if (window.game.syncCameraToPlayer) {
                    const origSync = window.game.syncCameraToPlayer.bind(window.game);
                    window.game.syncCameraToPlayer = function() { /* disabled */ };
                    
                    // Also try disabling Player.updateCamera
                    if (typeof window.Player !== 'undefined') {
                        console.log('Attempting to disable player camera sync...');
                    }
                }

                // Set initial camera position for top-down view
                camState.x = 100; camState.y = 80; camState.z = -100;
                camState.lookAtX = 0; camState.lookAtY = 0; camState.lookAtZ = 0;
                
                camera.position.set(camState.x, camState.y, camState.z);
                camera.lookAt(camState.lookAtX, camState.lookAtY, camState.lookAtZ);

                // Start debug overlay update loop
                requestAnimationFrame(updateDebugOverlay);
            } else {
                setTimeout(waitForGame, 250);
            }
        }

        waitForGame();
    </script>
</body>
</html>
